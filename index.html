<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B1E24">
<title>Control de Listas</title>
<meta name="apple-mobile-web-app-title" content="Control de Listas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#1B1E24;
    --surface:#242832;
    --surface-2:#2E3340;
    --surface-3:#363C49;
    --accent:#F4B400;
    --accent-dark:#C98F00;
    --text:#EDEFF3;
    --muted:#8A93A6;
    --success:#3FB871;
    --success-bg:#1D3327;
    --danger:#E5484D;
    --info:#3B82F6;
    --border:#363C49;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; }
  button{ font-family:inherit; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- Role picker ---------- */
  .role-screen{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:32px 20px; gap:16px;
  }
  .role-brand{ text-align:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:34px; letter-spacing:0.02em; color:var(--text); margin-bottom:6px; line-height:1.05; }
  .role-eyebrow{ color:var(--accent); font-family:'Oswald',sans-serif; letter-spacing:0.2em; font-size:12px; text-align:center; margin-bottom:22px;}
  .role-title{ text-align:center; font-size:22px; margin:0 0 28px 0; color:var(--muted); font-family:'Inter',sans-serif; text-transform:none; letter-spacing:0; font-weight:600; }
  .role-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:22px 20px; display:flex; align-items:center; gap:16px; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .role-card:active{ transform:scale(0.98); }
  .role-card:hover{ border-color:var(--accent); }
  .role-tag{
    width:52px; height:52px; border-radius:10px; background:var(--accent); color:#1B1E24;
    display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-weight:700; font-size:20px; flex-shrink:0;
  }
  .role-info h3{ margin:0 0 4px 0; font-size:17px; letter-spacing:0.02em; }
  .role-info p{ margin:0; color:var(--muted); font-size:13px; line-height:1.4; }

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:14px 16px 12px 16px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; row-gap:10px;
  }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .topbar-title{ display:flex; align-items:center; gap:10px; }
  .role-pill{
    background:var(--accent); color:#1B1E24; font-family:'Oswald'; font-weight:600;
    font-size:11px; letter-spacing:0.08em; padding:4px 9px; border-radius:6px;
  }
  .topbar h1{ font-size:18px; margin:0; }
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:12px; cursor:pointer;
  }
  .icon-btn:active{ background:var(--surface-3); }

  main{ flex:1; padding:14px 14px 90px 14px; }

  /* ---------- Search / filters ---------- */
  .search-box{
    display:flex; align-items:center; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; gap:8px; margin-bottom:12px;
  }
  .search-box input{
    flex:1; background:none; border:none; color:var(--text); font-size:15px; outline:none;
  }
  .search-box input::placeholder{ color:var(--muted); }
  .clear-search-btn{
    background:var(--surface-2); border:none; color:var(--muted); width:22px; height:22px;
    border-radius:50%; font-size:15px; line-height:1; cursor:pointer; flex-shrink:0;
  }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; }
  .chip{
    flex-shrink:0; background:var(--surface); border:1px solid var(--border); color:var(--muted);
    padding:7px 13px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:'Oswald'; letter-spacing:0.03em;
  }
  .chip.active{ background:var(--accent); color:#1B1E24; border-color:var(--accent); }

  /* ---------- Product list ---------- */
  .product-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:13px 14px; margin-bottom:8px;
  }
  .product-name{ font-size:14.5px; font-weight:600; margin:0 0 3px 0; }
  .product-meta{ font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .aisle-tag{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--accent); color:#1B1E24; font-family:'Oswald'; font-weight:700;
    font-size:11px; padding:2px 7px; border-radius:5px; letter-spacing:0.02em; cursor:pointer;
  }
  .add-btn{
    background:var(--surface-2); border:1px solid var(--accent); color:var(--accent);
    width:36px; height:36px; border-radius:9px; font-size:19px; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  .add-btn:active{ background:var(--accent); color:#1B1E24; }
  .add-btn.added{ background:var(--success-bg); border-color:var(--success); color:var(--success); font-size:16px; }
  .product-row-actions{ display:flex; flex-direction:row; align-items:center; gap:8px; flex-shrink:0; }
  .traer-bodega-btn{
    background:var(--surface-2); border:1px solid var(--info); color:var(--info);
    font-size:10.5px; padding:5px 8px; border-radius:7px; cursor:pointer; white-space:nowrap; font-weight:600;
  }
  .traer-bodega-btn:active{ background:var(--info); color:#fff; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty-state .big{ font-size:15px; color:var(--text); margin-bottom:6px; font-weight:600; }

  /* ---------- FAB / draft bar ---------- */
  .fab-bar{
    position:fixed; left:14px; right:14px; bottom:16px; z-index:30;
    background:var(--accent); color:#1B1E24; border:none; border-radius:14px;
    padding:15px 18px; display:flex; align-items:center; justify-content:space-between;
    font-family:'Oswald'; font-weight:600; font-size:14px; letter-spacing:0.03em; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }

  /* ---------- Sheet / modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,11,14,0.6); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--surface); width:100%; max-width:520px; border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom)) 16px; max-height:85vh; overflow-y:auto;
  }
  .sheet-handle{ width:38px; height:4px; background:var(--surface-3); border-radius:2px; margin:0 auto 14px auto; }
  .sheet h3{ font-size:17px; margin:0 0 14px 0; }
  .sheet-close{ background:none; border:none; color:var(--muted); font-size:20px; float:right; cursor:pointer; }

  .qty-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin:18px 0; }
  .qty-btn{
    width:44px; height:44px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); font-size:20px; font-weight:700; cursor:pointer;
  }
  .qty-val{ font-family:'Oswald'; font-size:28px; min-width:48px; text-align:center; }
  textarea, input[type=text]{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:14px; font-family:inherit; outline:none;
  }
  .field-label{ font-size:12px; color:var(--muted); margin:12px 0 6px 0; font-weight:600; }
  .primary-btn{
    width:100%; background:var(--accent); color:#1B1E24; border:none; border-radius:11px;
    padding:14px; font-family:'Oswald'; font-weight:600; font-size:14.5px; letter-spacing:0.03em;
    margin-top:16px; cursor:pointer;
  }
  .primary-btn:disabled{ opacity:0.4; }
  .secondary-btn{
    width:100%; background:none; color:var(--muted); border:1px solid var(--border); border-radius:11px;
    padding:12px; font-size:13.5px; margin-top:10px; cursor:pointer;
  }
  .danger-link{ color:var(--danger); background:none; border:none; font-size:13px; cursor:pointer; }

  .draft-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .draft-item:last-child{ border-bottom:none; }
  .draft-item-name{ font-size:14px; font-weight:600; }
  .draft-item-meta{ font-size:12px; color:var(--muted); }
  .remove-x{ background:none; border:none; color:var(--danger); font-size:20px; cursor:pointer; padding:4px 8px;}
  .inline-stepper{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:9px; padding:5px 8px; flex-shrink:0;
  }
  .stepper-btn{
    background:none; border:none; color:var(--accent); font-size:18px; font-weight:700; width:20px; height:24px; cursor:pointer; line-height:1;
  }
  .stepper-val{ font-family:'Oswald'; font-weight:700; font-size:14px; min-width:14px; text-align:center; }

  /* ---------- Bodega ---------- */
  .progress-wrap{ margin-bottom:16px; }
  .progress-bar{ height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--success); transition:width .3s ease; }
  .progress-label{ font-size:12px; color:var(--muted); margin-top:6px; }

  .aisle-group{ margin-bottom:18px; }
  .aisle-header{
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .aisle-header .aisle-tag{ font-size:12px; padding:3px 9px; }
  .aisle-count{ font-size:12px; color:var(--muted); }

  .check-row{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; margin-bottom:8px;
  }
  .check-row[data-select-sinex], .check-row[data-select-pedido]{ cursor:pointer; }
  .check-row.done{ background:var(--success-bg); border-color:var(--success); }
  .checkbox{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--bg);
  }
  .checkbox[data-sihay]{ cursor:pointer; }
  .checkbox[data-sihay]:active{ background:var(--success); border-color:var(--success); }
  .no-hay-btn{
    background:none; border:1px solid var(--border); color:var(--muted);
    font-size:11px; padding:6px 9px; border-radius:7px; flex-shrink:0; cursor:pointer; white-space:nowrap;
  }
  .qty-badge{
    background:var(--surface-2); font-family:'Oswald'; font-weight:700; font-size:13px;
    padding:3px 9px; border-radius:6px; margin-left:auto; flex-shrink:0;
  }
  .note-line{ font-size:12px; color:var(--accent); margin-top:2px; }

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }

  .col-select{ display:flex; flex-direction:column; gap:10px; margin:14px 0; }
  .col-select label{ font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; }
  select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:10px 12px; font-size:14px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  let state = {
    role: null,
    catalog: [],
    search: '',
    aisleFilter: 'todos',
    draft: [],
    activeProduct: null,
    qty: 1,
    note: '',
    listaActual: null,
    showDraftSheet: false,
    showCsvSheet: false,
    showReportes: false,
    showPedidosBodega: false,
    reportData: null,
    seleccionSinExistencia: {},
    seleccionPedidosBodega: {},
    pendientesSinExistencia: [],
    showHistorial: false,
    historialFiltro: 'todas',
    historialData: null,
    pedidosBodegaData: null,
    toast: null,
    channel: null
  };

  const DRAFT_STORAGE_KEY = 'control-listas:draft';
  const ROLE_STORAGE_KEY = 'control-listas:role';
  function guardarDraftLocal(){
    try{ localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(state.draft)); }catch(e){}
  }
  function cargarDraftLocal(){
    try{
      const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function setState(patch){ Object.assign(state, patch); guardarDraftLocal(); render(); }
  function showToast(msg, duration){
    setState({toast: msg});
    setTimeout(()=>{ if(state.toast===msg) setState({toast:null}); }, duration || 2200);
  }
  function describeError(error){
    if(!error) return 'error desconocido';
    const parts = [error.message || error.error_description || error.msg || JSON.stringify(error)];
    if(error.hint) parts.push('Pista: ' + error.hint);
    if(error.code) parts.push('(' + error.code + ')');
    return parts.join(' — ');
  }

  // ---------- Supabase ----------
  const SUPABASE_URL = 'https://ziprglcjkxzwpywvfokq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppcHJnbGNqa3h6d3B5d3Zmb2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NDUyNDIsImV4cCI6MjEwMDQyMTI0Mn0.QwIILFPzgEXBjDpzreb4d5u-EvjFQnxc7SZADJ0fRfQ';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadCatalog(){
    const pageSize = 1000;
    let all = [];
    let from = 0;
    while(true){
      const { data, error } = await supabase.from('productos').select('*').order('nombre').range(from, from + pageSize - 1);
      if(error){ console.error('load productos error:', error); showToast('Error al cargar catálogo: ' + describeError(error), 6000); return; }
      all = all.concat(data || []);
      if(!data || data.length < pageSize) break;
      from += pageSize;
    }
    setState({ catalog: all.map(p=>({ id:p.id, codigo:p.codigo||'', nombre:p.nombre, pasillo:p.pasillo||'' })) });
  }
  async function loadLista(){
    const { data, error } = await supabase.from('lista_items').select('*').is('archivada_en', null).eq('traer_bodega', false).order('id', { ascending:true });
    if(error){ setState({ listaActual:null }); return; }
    setState({ listaActual: (data && data.length) ? { items: data } : null });
  }

  function startRealtime(){
    stopRealtime();
    state.channel = supabase.channel('lista_items_cambios')
      .on('postgres_changes', { event:'*', schema:'public', table:'lista_items' }, (payload)=>{
        if(state.role==='bodega' && payload.eventType==='INSERT' && payload.new && !payload.new.traer_bodega){ alertaNuevaLista(); }
        if(state.role==='piso' && payload.eventType==='UPDATE' && payload.new && payload.new.archivada_en){ alertaListaTerminada(); }
        loadLista();
        if(state.role==='piso'){ loadPendientesSinExistencia(); }
      })
      .subscribe();
  }
  function stopRealtime(){
    if(state.channel){ supabase.removeChannel(state.channel); state.channel = null; }
  }

  // ---------- alerta (vibración + sonido) ----------
  let audioCtx = null;
  function desbloquearAudio(){
    try{
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    }catch(e){}
  }
  function tono(startTime, freq, duracion){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duracion);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duracion + 0.05);
  }
  function alertaNuevaLista(){
    if(navigator.vibrate){ navigator.vibrate([300,120,300,120,300]); }
    if(audioCtx){
      const now = audioCtx.currentTime;
      tono(now, 880, 0.18);
      tono(now + 0.24, 880, 0.18);
      tono(now + 0.48, 880, 0.18);
    }
  }
  let ultimaAlertaTerminada = 0;
  function alertaListaTerminada(){
    const ahora = Date.now();
    if(ahora - ultimaAlertaTerminada < 3000) return; // evita repetir por cada producto archivado
    ultimaAlertaTerminada = ahora;
    if(navigator.vibrate){ navigator.vibrate([200,80,200]); }
    if(audioCtx){
      const now = audioCtx.currentTime;
      tono(now, 660, 0.15);
      tono(now + 0.18, 990, 0.22);
    }
    showToast('¡Bodega terminó de surtir la lista!', 4000);
  }

  // ---------- helpers ----------
  function detectCol(headers, candidates){
    const h = headers.find(x => candidates.includes(x.trim().toLowerCase()));
    return h || '';
  }
  function aislesFromCatalog(){
    const set = new Set(state.catalog.map(p=>p.pasillo).filter(Boolean));
    return Array.from(set).sort((a,b)=> a.localeCompare(b, 'es', {numeric:true}));
  }
  function filteredProducts(){
    let list = state.catalog;
    if(state.aisleFilter !== 'todos') list = list.filter(p=>p.pasillo === state.aisleFilter);
    if(state.search.trim()){
      const q = state.search.trim().toLowerCase();
      list = list.filter(p => p.nombre.toLowerCase().includes(q) || (p.codigo||'').toLowerCase().includes(q));
    }
    return list.slice(0, 150);
  }
  // ---------- actions ----------
  function openProduct(p){
    const yaAgregado = state.draft.some(d => d.codigo === p.codigo && d.nombre === p.nombre);
    if(yaAgregado){ showToast('Ese producto ya está en tu lista'); return; }
    setState({ activeProduct: p, qty: 1, note: '' });
  }
  function addDraft(){
    const p = state.activeProduct;
    const item = { id: p.codigo + '-' + Date.now(), codigo: p.codigo, nombre: p.nombre, pasillo: p.pasillo, cantidad: state.qty, nota: state.note.trim(), traerBodega: false };
    setState({ draft: [...state.draft, item], activeProduct: null });
    showToast('Agregado a la lista');
    verificarLimiteYEnviar();
  }
  function agregarTraerBodega(){
    const p = state.activeProduct;
    if(!p) return;
    const item = { id: (p.codigo||'sc') + '-' + Date.now(), codigo: p.codigo, nombre: p.nombre, pasillo: p.pasillo, cantidad: state.qty, nota: state.note.trim(), traerBodega: true };
    setState({ draft: [...state.draft, item], activeProduct: null });
    showToast('Agregado como "Traer de bodega"');
    verificarLimiteYEnviar();
  }
  const LIMITE_ARTICULOS_LISTA = 5;
  function verificarLimiteYEnviar(){
    if(state.draft.length >= LIMITE_ARTICULOS_LISTA){
      showToast('Se alcanzaron ' + LIMITE_ARTICULOS_LISTA + ' productos, enviando a bodega...', 3000);
      enviarLista().then(render);
    }
  }
  function removeDraft(id){
    setState({ draft: state.draft.filter(d=>d.id!==id) });
  }
  function cambiarCantidad(id, delta){
    const item = state.draft.find(d=>d.id===id);
    if(!item) return;
    const nuevaCantidad = item.cantidad + delta;
    if(nuevaCantidad <= 0){
      setState({ draft: state.draft.filter(d=>d.id!==id) });
    } else {
      setState({ draft: state.draft.map(d=> d.id===id ? {...d, cantidad: nuevaCantidad} : d) });
    }
  }
  async function enviarLista(){
    const rows = state.draft.map(d => ({
      codigo: d.codigo || null, nombre: d.nombre, pasillo: d.pasillo || null,
      cantidad: d.cantidad, nota: d.nota || null, estado: 'pendiente', traer_bodega: !!d.traerBodega
    }));
    const { error } = await supabase.from('lista_items').insert(rows);
    if(error){ console.error('insert lista_items error:', error); showToast('No se pudo enviar: ' + describeError(error), 6000); return; }
    setState({ draft: [], showDraftSheet: false });
    await loadLista();
    showToast('Lista enviada a bodega');
  }
  async function marcarSiHay(itemId){
    if(!state.listaActual) return;
    const idNum = Number(itemId);
    setState({ listaActual: { ...state.listaActual, items: state.listaActual.items.filter(it=>Number(it.id)!==idNum) } });
    const { error } = await supabase.from('lista_items').update({ estado: 'reunido', archivada_en: new Date().toISOString() }).eq('id', idNum);
    if(error){ console.error('update lista_items error:', error); showToast('No se pudo actualizar: ' + describeError(error), 6000); }
    await loadLista();
  }
  async function marcarNoHay(itemId){
    if(!state.listaActual) return;
    const idNum = Number(itemId);
    setState({ listaActual: { ...state.listaActual, items: state.listaActual.items.filter(it=>Number(it.id)!==idNum) } });
    const { error } = await supabase.from('lista_items').update({ estado: 'no_hay', archivada_en: new Date().toISOString() }).eq('id', idNum);
    if(error){ console.error('update lista_items error:', error); showToast('No se pudo actualizar: ' + describeError(error), 6000); }
    await loadLista();
    await loadPendientesSinExistencia();

  async function finalizarLista(){
    if(!state.listaActual || !state.listaActual.items.length) return;
    const ids = state.listaActual.items.map(i=>i.id);
    if(!window.confirm('¿Cerrar la lista? Lo que quede sin marcar se guardará como pendiente en el historial.')) return;
    const { error } = await supabase.from('lista_items').update({ archivada_en: new Date().toISOString() }).in('id', ids);
    if(error){ console.error('archive lista_items error:', error); showToast('No se pudo cerrar la lista: ' + describeError(error), 6000); return; }
    showToast('Lista cerrada');
    await loadLista();
  }

  async function loadReportes(){
    const pageSize = 1000;
    let all = [];
    let from = 0;
    while(true){
      const { data, error } = await supabase.from('lista_items').select('nombre, cantidad').range(from, from + pageSize - 1);
      if(error){ console.error('load reportes error:', error); showToast('No se pudo cargar el historial: ' + describeError(error), 6000); return; }
      all = all.concat(data || []);
      if(!data || data.length < pageSize) break;
      from += pageSize;
    }
    const conteo = {};
    all.forEach(r=>{
      const key = r.nombre;
      if(!conteo[key]) conteo[key] = { nombre: key, veces: 0, piezas: 0 };
      conteo[key].veces += 1;
      conteo[key].piezas += (r.cantidad || 0);
    });
    const ranking = Object.values(conteo).sort((a,b)=> b.veces - a.veces).slice(0, 40);
    setState({ reportData: ranking, showReportes: true });
  }

  async function loadHistorial(){
    const { data, error } = await supabase.from('lista_items').select('*').not('archivada_en', 'is', null).order('creado_en', { ascending:false }).order('id', { ascending:true }).limit(2000);
    if(error){ console.error('load historial error:', error); showToast('No se pudo cargar el historial: ' + describeError(error), 6000); return; }
    const grupos = {};
    (data||[]).forEach(it=>{
      const key = it.creado_en;
      if(!grupos[key]) grupos[key] = { fecha: key, items: [] };
      grupos[key].items.push(it);
    });
    const listas = Object.values(grupos).sort((a,b)=> new Date(b.fecha) - new Date(a.fecha)).slice(0, 20);
    setState({ historialData: listas, showHistorial: true });
  }

  async function importCatalogRows(rows){
    const cleanRows = rows.filter(r => Object.values(r).some(v => String(v||'').trim() !== ''));
    if(!cleanRows.length){ showToast('El archivo parece estar vacío'); return; }
    const headers = Object.keys(cleanRows[0]);
    const map = {
      codigo: detectCol(headers, ['codigo','clave','sku','cod','código']),
      nombre: detectCol(headers, ['nombre','descripcion','producto','articulo','descripción']),
      pasillo: detectCol(headers, ['pasillo','ubicacion','seccion','anaquel','ubicación'])
    };
    if(!map.nombre){ showToast('No encontré una columna de nombre/descripción en el archivo', 6000); return; }

    const catalog = cleanRows.map(row => {
      const nombre = String(row[map.nombre]||'').trim();
      const pasilloArchivo = map.pasillo ? (String(row[map.pasillo]||'').trim() || null) : null;
      return {
        codigo: map.codigo ? (String(row[map.codigo]||'').trim() || null) : null,
        nombre: nombre,
        pasillo: pasilloArchivo
      };
    }).filter(p=>p.nombre);

    showToast('Cargando ' + catalog.length + ' productos...');
    const { error: delError } = await supabase.from('productos').delete().neq('id', 0);
    if(delError){ console.error('delete productos error:', delError); showToast('Error al limpiar catálogo: ' + describeError(delError), 6000); return; }

    const chunkSize = 500;
    for(let i=0; i<catalog.length; i+=chunkSize){
      const chunk = catalog.slice(i, i+chunkSize);
      const { error } = await supabase.from('productos').insert(chunk);
      if(error){ console.error('insert productos error:', error); showToast('Error subiendo productos: ' + describeError(error), 6000); return; }
    }
    await loadCatalog();
    setState({ showCsvSheet: false });
    showToast(catalog.length + ' productos cargados');
  }

  function handleCsvFile(file){
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if(ext === 'csv'){
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: (results)=> importCatalogRows(results.data),
        error: ()=> showToast('No se pudo leer el archivo')
      });
    } else if(ext === 'xlsx' || ext === 'xls'){
      const reader = new FileReader();
      reader.onload = (e)=>{
        try{
          const wb = XLSX.read(e.target.result, { type:'array' });
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { defval:'' });
          if(!rows.length){ showToast('El archivo parece estar vacío'); return; }
          importCatalogRows(rows);
        }catch(err){ showToast('No se pudo leer el archivo Excel'); }
      };
      reader.onerror = ()=> showToast('No se pudo leer el archivo');
      reader.readAsArrayBuffer(file);
    } else {
      showToast('Formato no soportado. Usa .csv, .xlsx o .xls');
    }
  }

    let html = `
      <div class="overlay" id="overlay-reportes">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div style="position:sticky; top:0; background:var(--surface); z-index:5; padding-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <h3 style="margin:0;">Lo que más se repone</h3>
            <button class="secondary-btn" id="btn-close-reportes" style="width:auto; margin:0; padding:9px 16px; flex-shrink:0;">Cerrar</button>
          </div>`;
    if(!items.length){
      html += `<div class="empty-state">Aún no hay suficiente historial.</div>`;
    } else {
      html += items.map((it,i)=>`
        <div class="draft-item">
          <div>
            <div class="draft-item-name">${i+1}. ${escapeHtml(it.nombre)}</div>
            <div class="draft-item-meta">${it.veces} ${it.veces===1?'vez':'veces'} en listas · ${it.piezas} piezas en total</div>
          </div>
        </div>`).join('');
    }
    html += `</div></div>`;
    app.insertAdjacentHTML('beforeend', html);
    const closeBtn = document.getElementById('btn-close-reportes');
    if(closeBtn) closeBtn.onclick = ()=> setState({ showReportes:false });
  }

  function renderPedidosBodegaOverlay(){
    const existing = document.getElementById('overlay-pedidos-bodega');
    if(existing) existing.remove();
    if(!state.showPedidosBodega) return;
    const items = state.pedidosBodegaData || [];
    let html = `
      <div class="overlay" id="overlay-pedidos-bodega">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div style="position:sticky; top:0; background:var(--surface); z-index:5; padding-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <h3 style="margin:0;">Pedidos de bodega</h3>
            <button class="secondary-btn" id="btn-close-pedidos-bodega" style="width:auto; margin:0; padding:9px 16px; flex-shrink:0;">Cerrar</button>
          </div>`;
    if(!items.length){
      html += `<div class="empty-state">No hay productos marcados como "Traer de bodega" todavía.</div>`;
    } else {
      const seleccionados = items.filter(it=>state.seleccionPedidosBodega[it.id]);
      html += `
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <button class="secondary-btn" id="btn-seleccionar-todo-pedidos" style="margin:0; flex:1;">${seleccionados.length===items.length ? 'Quitar selección' : 'Seleccionar todo'}</button>
          <button class="primary-btn" id="btn-limpiar-pedidos" style="margin:0; flex:1; background:var(--danger);" ${seleccionados.length?'':'disabled'}>Limpiar (${seleccionados.length})</button>
        </div>`;
      html += items.map(it=>{
        const fechaTexto = new Date(it.creado_en).toLocaleString('es-MX', { dateStyle:'medium', timeStyle:'short' });
        const marcado = !!state.seleccionPedidosBodega[it.id];
        return `
        <div class="check-row ${marcado?'done':''}" data-select-pedido="${escapeAttr(it.id)}">
          <div class="checkbox" style="${marcado?'background:var(--success); border-color:var(--success);':''}">${marcado?'✓':''}</div>
          <div>
            <div class="draft-item-name">${escapeHtml(it.nombre)} <span class="qty-badge">x${it.cantidad}</span></div>
            ${it.nota?`<div class="draft-item-meta">${escapeHtml(it.nota)}</div>`:''}
            <div class="draft-item-meta">${escapeHtml(fechaTexto)}</div>
          </div>
        </div>`;
      }).join('');
    }
    html += `</div></div>`;
    app.insertAdjacentHTML('beforeend', html);
    const closeBtn2 = document.getElementById('btn-close-pedidos-bodega');
    if(closeBtn2) closeBtn2.onclick = ()=> setState({ showPedidosBodega:false });
    document.querySelectorAll('#overlay-pedidos-bodega [data-select-pedido]').forEach(row=>{
      row.onclick = ()=>{
        const id = row.dataset.selectPedido;
        const sel = { ...state.seleccionPedidosBodega };
        if(sel[id]) delete sel[id]; else sel[id] = true;
        setState({ seleccionPedidosBodega: sel });
      };
    });
    const selTodoPedidos = document.getElementById('btn-seleccionar-todo-pedidos');
    if(selTodoPedidos){
      selTodoPedidos.onclick = ()=>{
        const todosIds = (state.pedidosBodegaData||[]).map(it=>it.id);
        const yaTodoSeleccionado = todosIds.every(id=> state.seleccionPedidosBodega[id]);
        if(yaTodoSeleccionado){ setState({ seleccionPedidosBodega:{} }); }
        else{
          const sel = {};
          todosIds.forEach(id=> sel[id]=true);
          setState({ seleccionPedidosBodega: sel });
        }
      };
    }
    const limpiarBtn = document.getElementById('btn-limpiar-pedidos');
    if(limpiarBtn) limpiarBtn.onclick = limpiarPedidosBodegaSeleccionados;
  }

  function renderOverlays(){
    let overlayHtml = '';
    if(state.activeProduct){
      const p = state.activeProduct;
      overlayHtml += `
        <div class="overlay" id="overlay-product">
          <div class="sheet">
            <div class="sheet-handle"></div>
            <h3>${escapeHtml(p.nombre)}</h3>
            <div class="qty-row">
              <button class="qty-btn" id="qty-minus">−</button>
              <div class="qty-val">${state.qty}</div>
              <button class="qty-btn" id="qty-plus">+</button>
            </div>
            <div class="field-label">Nota (opcional)</div>
            <input type="text" id="note-input" placeholder="Ej. solo faltan 2 charolas" value="${escapeAttr(state.note)}">
            <button class="primary-btn" id="btn-confirm-add">Agregar a la lista</button>
            <button class="primary-btn" id="btn-confirm-traerbodega" style="background:var(--info); margin-top:10px;">Traer de bodega</button>
            <button class="secondary-btn" id="btn-cancel-add">Cancelar</button>
          </div>
        </div>`;
    }
    if(state.showDraftSheet){
      overlayHtml += `
        <div class="overlay" id="overlay-draft">
          <div class="sheet">
            <div class="sheet-handle"></div>
            <div style="position:sticky; top:0; background:var(--surface); z-index:5; padding-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
              <h3 style="margin:0;">Tu lista (${state.draft.length})</h3>
              <button class="secondary-btn" id="btn-close-draft" style="width:auto; margin:0; padding:9px 16px; flex-shrink:0;">Cerrar</button>
            </div>`;
      if(state.draft.length===0){
        overlayHtml += `<div class="empty-state">Aún no has agregado productos.</div>`;
      } else {
        [...state.draft].reverse().forEach(it=>{
          overlayHtml += `
              <div class="draft-item">
                <div>
                  <div class="draft-item-name">${escapeHtml(it.nombre)}</div>
                  ${it.traerBodega ? `<span class="aisle-tag" style="background:var(--info); color:#fff;">TRAER DE BODEGA</span>` : ''}
                  ${it.nota?`<div class="draft-item-meta">${escapeHtml(it.nota)}</div>`:''}
                </div>
                <div class="inline-stepper">
                  <button class="stepper-btn" data-dec="${escapeAttr(it.id)}">−</button>
                  <span class="stepper-val">${it.cantidad}</span>
                  <button class="stepper-btn" data-inc="${escapeAttr(it.id)}">+</button>
                </div>
                <button class="remove-x" data-remove="${escapeAttr(it.id)}">×</button>
              </div>`;
        });
        overlayHtml += `<button class="primary-btn" id="btn-enviar">Enviar lista a bodega</button>`;
      }
      overlayHtml += `</div></div>`;
    }
    if(state.showCsvSheet){
      overlayHtml += renderCsvSheet();
    }
    const existingOverlay = document.querySelectorAll('.overlay');
    existingOverlay.forEach(o=>o.remove());
    if(overlayHtml){
      app.insertAdjacentHTML('beforeend', overlayHtml);
      wireOverlayEvents();
    }
    renderToast();
  }

  function renderCsvSheet(){
    return `
      <div class="overlay" id="overlay-csv">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <h3>Cargar catálogo</h3>
          <p style="color:var(--muted); font-size:13px; line-height:1.5;">Sube el archivo exportado de SICAR (CSV o Excel). Se detectan las columnas solas y se carga automáticamente.</p>
          <input type="file" id="csv-file" accept=".csv,.xlsx,.xls" style="margin-top:10px; color:var(--text);">
          <button class="secondary-btn" id="btn-close-csv">Cancelar</button>
        </div>
      </div>`;
  }

  function wireOverlayEvents(){
    const qMinus = document.getElementById('qty-minus');
    const qPlus = document.getElementById('qty-plus');
    if(qMinus) qMinus.onclick = ()=>{ state.qty = Math.max(1, state.qty-1); renderOverlays(); syncQtyDisplay(); };
    if(qPlus) qPlus.onclick = ()=>{ state.qty = state.qty+1; renderOverlays(); };
    const noteInput = document.getElementById('note-input');
    if(noteInput) noteInput.oninput = (e)=>{ state.note = e.target.value; };
    const confirmAdd = document.getElementById('btn-confirm-add');
    if(confirmAdd) confirmAdd.onclick = ()=>{ addDraft(); render(); };
    const confirmTraerBodega = document.getElementById('btn-confirm-traerbodega');
    if(confirmTraerBodega) confirmTraerBodega.onclick = ()=>{ agregarTraerBodega(); render(); };
    const cancelAdd = document.getElementById('btn-cancel-add');
    if(cancelAdd) cancelAdd.onclick = ()=> setState({ activeProduct:null });

    const closeDraft = document.getElementById('btn-close-draft');
    if(closeDraft) closeDraft.onclick = ()=> setState({ showDraftSheet:false });
    app.querySelectorAll('[data-remove]').forEach(b=> b.onclick = ()=>{ removeDraft(b.dataset.remove); renderOverlays(); render(); });
    app.querySelectorAll('#overlay-draft [data-inc]').forEach(b=> b.onclick = ()=>{ cambiarCantidad(b.dataset.inc, 1); renderOverlays(); render(); });
    app.querySelectorAll('#overlay-draft [data-dec]').forEach(b=> b.onclick = ()=>{ cambiarCantidad(b.dataset.dec, -1); renderOverlays(); render(); });
    const enviarBtn = document.getElementById('btn-enviar');
    if(enviarBtn) enviarBtn.onclick = ()=> enviarLista().then(render);

    const csvFile = document.getElementById('csv-file');
    if(csvFile) csvFile.onchange = (e)=>{ if(e.target.files[0]) handleCsvFile(e.target.files[0]); };
    const closeCsv = document.getElementById('btn-close-csv');
    if(closeCsv) closeCsv.onclick = ()=> setState({ showCsvSheet:false });
  }
  function syncQtyDisplay(){}

  function renderToast(){
    const old = document.querySelector('.toast');
    if(old) old.remove();
    if(state.toast){
      const div = document.createElement('div');
      div.className='toast';
      div.textContent = state.toast;
      app.appendChild(div);
    }
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  state.draft = cargarDraftLocal();
  try{
    const rolGuardado = localStorage.getItem(ROLE_STORAGE_KEY);
    if(rolGuardado === 'piso' || rolGuardado === 'bodega'){
      state.role = rolGuardado;
      desbloquearAudio();
      loadCatalog();
      loadLista();
      loadPendientesSinExistencia();
      startRealtime();
    }
  }catch(e){}
  render();
})();
</script>
</body>
</html>
